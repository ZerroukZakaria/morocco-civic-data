services:
  postgres:
    image: postgres:17
    environment:
      # Throwaway local-only credentials for development
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic_local_only
      POSTGRES_DB: civic
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civic"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata: